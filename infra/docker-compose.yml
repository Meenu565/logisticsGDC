services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: smart_dispatcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - smart_dispatcher_pg:/var/lib/postgresql/data

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/smart_dispatcher
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    build:
      context: ../apps/web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  smart_dispatcher_pg:

